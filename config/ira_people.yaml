# Template do IRA (isaacsim.replicator.agent) — pessoas animadas no app V2.
#
# O app (main.py) sobrepõe, em runtime:
#   - character.groups.*.num          <- people.count do sim.yaml
#   - environment.base_stage_asset_path <- assets/ira_ground.usda (absoluto)
#
# Rotinas: wander = caminhada aleatória com pausas (idle), idiom do exemplo
# oficial tools/actor_sdg/sample_config.yaml do Isaac Sim 6.0.
isaacsim.replicator.agent:
  version: 1.6.0
  # 24 h de duração: a simulação roda até o operador fechar o app
  simulation_duration: 86400.0
  environment:
    base_stage_asset_path: ""
  character:
    groups:
      pedestrians:
        asset_path: "Isaac/People/Characters/"
        num: 10
        routines:
          - wander:
              weight: 1
              repeat: 1
              walk:
                speed_range: [0.8, 1.5]
                distance_range: [5.0, 10.0]
              idle:
                - animation: idle
                  weight: 1
                  time_range: [2.0, 5.0]
